<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>测试文档弹窗</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <h1>测试文档管理弹窗</h1>
    <button onclick="testModal()">点击测试弹窗</button>

    <!-- 文档管理 Modal -->
    <div class="modal-overlay" id="docsModal" style="display:none;">
        <div class="modal docs-modal">
            <div class="modal-header">
                <h3 class="modal-title" id="docsModalTitle">文档管理</h3>
                <button class="icon-btn" id="docsCloseBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="modal-body" style="padding: 20px;">
                <div class="docs-toolbar">
                    <button class="btn btn-primary btn-sm">上传文档</button>
                    <button class="btn btn-danger btn-sm">批量删除</button>
                </div>

                <div class="docs-list" id="docsList">
                    <div class="empty-state">测试内容</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function testModal() {
            console.log('测试弹窗函数被调用');
            const modal = document.getElementById('docsModal');
            console.log('Modal 元素:', modal);
            if (modal) {
                modal.style.display = 'flex';
                console.log('Modal display 设置为 flex');
            } else {
                console.error('找不到 docsModal 元素');
            }
        }

        // 关闭按钮
        document.getElementById('docsCloseBtn').addEventListener('click', () => {
            console.log('关闭按钮被点击');
            document.getElementById('docsModal').style.display = 'none';
        });
    </script>
</body>

</html>
