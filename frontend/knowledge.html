<!DOCTYPE html>
<!-- 知识库管理页面 -->
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库管理 - ponyrag知识库系统</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%236366f1'/><text x='32' y='44' text-anchor='middle' fill='white' font-size='28' font-weight='bold' font-family='Arial'>AI</text></svg>">
    <link rel="stylesheet" href="/static/style.css">
    <!-- 国际化 -->
    <script src="/static/i18n.js"></script>
    <!-- 立即应用主题，防止深色模式下页面闪白 -->
    <script>
        (function() {
            const t = localStorage.getItem('general_theme');
            if (t) {
                try {
                    document.documentElement.setAttribute('data-theme', JSON.parse(t));
                } catch (e) {}
            }
        })();
    </script>
</head>

<body>
    <div class="app-container">

        <!-- 侧边栏 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2 data-i18n="app.title">ponyrag知识库系统</h2>
                <button class="sidebar-toggle" id="sidebarToggle" title="收起侧边栏">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
            </div>

            <!-- 导航菜单 -->
            <div class="sidebar-section">
                <h3 data-i18n="sidebar.nav">导航</h3>
                <nav class="nav-menu">
                    <a href="/" class="nav-item">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span data-i18n="nav.chat">聊天对话</span>
                    </a>
                    <a href="/knowledge" class="nav-item active">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                        </svg>
                        <span data-i18n="nav.knowledge">知识库管理</span>
                    </a>
                </nav>
            </div>

            <!-- 系统状态 -->
            <div class="sidebar-section">
                <h3 data-i18n="sidebar.status">系统状态</h3>
                <div class="status-info">
                    <div class="status-item">
                        <span class="status-label" data-i18n="kb.count">知识库数量:</span>
                        <span class="status-value" id="kbCount">-</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label" data-i18n="kb.enabledCount">启用状态:</span>
                        <span class="status-value" id="enabledCount">-</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label" data-i18n="kb.vectorCount">向量库条目:</span>
                        <span class="status-value" id="dbCount">-</span>
                    </div>
                    <div class="status-item">
                        <span class="status-label" data-i18n="kb.fileCount">上传文件:</span>
                        <span class="status-value" id="fileCount">-</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">

            <!-- 顶部栏 -->
            <header class="topbar">
                <button class="menu-btn" id="menuBtn" title="菜单">
                    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>

                <div class="topbar-title">
                    <h1 data-i18n="kb.pageTitle">知识库管理</h1>
                </div>

                <div class="topbar-actions">
                    <span class="connection-status" id="connectionStatus">
                        <span class="status-dot"></span>
                        <span class="status-text" data-i18n="app.connecting">连接中...</span>
                    </span>
                </div>
            </header>

            <!-- 知识库列表 -->
            <div class="kb-container">

                <!-- 操作栏 -->
                <div class="kb-toolbar">
                    <button class="btn btn-primary" id="createKbBtn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        <span data-i18n="kb.create">创建知识库</span>
                    </button>
                </div>

                <!-- 知识库卡片列表 -->
                <div class="kb-grid" id="kbGrid">
                    <!-- 动态渲染知识库卡片 -->
                </div>

            </div>

        </main>
    </div>

    <!-- 创建/编辑知识库 Modal -->
    <div class="modal-overlay" id="kbModal" style="display:none;">
        <div class="modal">
            <h3 class="modal-title" id="kbModalTitle" data-i18n="kb.modal.create">创建知识库</h3>

            <div class="modal-body">
                <div class="settings-field">
                    <label><span data-i18n="kb.modal.nameRequired">知识库名称 *</span></label>
                    <input type="text" id="kbNameInput" class="model-select" data-i18n-attr="placeholder" data-i18n="kb.modal.namePlaceholder" placeholder="例如：客服知识库" maxlength="50">
                </div>

                <div class="settings-field">
                    <label>
                        <span data-i18n="kb.modal.desc">描述</span>
                        <span style="color: var(--text-secondary); font-size: 0.85rem;" data-i18n="kb.modal.descOptional">(可选)</span>
                    </label>
                    <textarea id="kbDescInput" class="kb-desc-input" data-i18n-attr="placeholder" data-i18n="kb.modal.descPlaceholder" placeholder="简要描述知识库的用途..." rows="3" maxlength="200"></textarea>
                </div>

                <p class="settings-hint" id="kbModalHint"></p>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="kbCancelBtn" data-i18n="btn.cancel">取消</button>
                <button class="btn btn-primary" id="kbSaveBtn" data-i18n="btn.save">保存</button>
            </div>
        </div>
    </div>

    <!-- 删除确认 Modal -->
    <div class="modal-overlay" id="deleteKbModal" style="display:none;">
        <div class="modal">
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                    <path d="M10 11v6M14 11v6"></path>
                    <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                </svg>
            </div>

            <h3 class="modal-title" data-i18n="kb.delete.title">删除知识库</h3>
            <p class="modal-body" id="deleteKbModalBody">确定要删除该知识库吗？</p>
            <p class="modal-hint" data-i18n="kb.delete.hint">此操作将删除知识库中的所有文档和向量数据，不可恢复。</p>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="deleteKbCancelBtn" data-i18n="btn.cancel">取消</button>
                <button class="btn btn-danger" id="deleteKbConfirmBtn" data-i18n="btn.delete">删除</button>
            </div>
        </div>
    </div>

    <!-- 文档管理 Modal -->
    <div class="modal-overlay" id="docsModal" style="display:none;">
        <div class="modal docs-modal">
            <div class="modal-header">
                <h3 class="modal-title" id="docsModalTitle" data-i18n="docs.title">文档管理</h3>
                <button class="icon-btn" id="docsCloseBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="modal-body" style="padding: 20px;">
                <!-- 工具栏 -->
                <div class="docs-toolbar">
                    <input type="file" id="docsFileInput" accept=".pdf,.docx,.doc,.txt,.md,.xlsx,.xls,.pptx,.ppt" multiple hidden>
                    <input type="file" id="docsFolderInput" webkitdirectory multiple hidden>
                    <button class="btn btn-primary btn-sm" id="docsUploadBtn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                        <span data-i18n="docs.upload">上传文档</span>
                    </button>
                    <button class="btn btn-folder btn-sm" id="docsFolderBtn">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span data-i18n="docs.uploadDir">上传目录</span>
                    </button>
                    <button class="btn btn-danger btn-sm" id="docsBatchDeleteBtn" disabled>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                        </svg>
                        <span id="docsBatchDeleteText" data-i18n="docs.batchDelete">批量删除</span>
                    </button>
                </div>

                <!-- 切分参数面板（折叠） -->
                <details class="upload-chunk-panel" id="uploadChunkPanel">
                    <summary class="upload-chunk-toggle">
                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                        <span data-i18n="docs.chunkParams">切分参数</span>
                        <span class="upload-chunk-badge" id="uploadChunkBadge" data-i18n="docs.chunkGlobal">使用全局设置</span>
                    </summary>
                    <div class="upload-chunk-body">
                        <div class="upload-chunk-row">
                            <label class="upload-chunk-label" data-i18n="docs.chunkMethod">切分方式</label>
                            <select id="uploadChunkMethod" class="upload-chunk-select">
                                <option value="" data-i18n="docs.chunkGlobal">— 使用全局设置 —</option>
                                <option value="fixed" data-i18n="chunk.fixed.desc.short">✂️ 固定切分 · 适合：纯文本、日志、数据导出</option>
                                <option value="recursive" data-i18n="chunk.recursive.desc.short">🔀 递归切分（推荐）· 适合：通用文档</option>
                                <option value="markdown" data-i18n="chunk.markdown.desc.short">📑 标题树切分 · 适合：保险条款、产品手册</option>
                                <option value="semantic" data-i18n="chunk.semantic.desc.short">🧠 语义切分（较慢）· 适合：文章、报告、书籍</option>
                            </select>
                        </div>
                        <div class="upload-chunk-row" id="uploadSizeRow">
                            <label class="upload-chunk-label">
                                <span data-i18n="docs.chunkSize">分块大小</span>
                                <span class="upload-chunk-hint" data-i18n="docs.chunkSizeUnit">token</span>
                            </label>
                            <input type="number" id="uploadChunkSize" class="upload-chunk-num" min="100" max="2000" step="50" placeholder="500">
                        </div>
                        <div class="upload-chunk-row" id="uploadOverlapRow">
                            <label class="upload-chunk-label">
                                <span data-i18n="docs.chunkOverlap">分块重叠</span>
                                <span class="upload-chunk-hint" data-i18n="docs.chunkSizeUnit">token</span>
                            </label>
                            <input type="number" id="uploadChunkOverlap" class="upload-chunk-num" min="0" max="500" step="10" placeholder="50">
                        </div>
                    </div>
                </details>

                <!-- 上传进度 -->
                <div class="upload-progress" id="docsUploadProgress" style="display:none; margin: 12px 0;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="docsProgressFill"></div>
                    </div>
                    <span class="progress-text" id="docsProgressText" data-i18n="docs.uploading">上传中...</span>
                </div>

                <!-- 文档列表 -->
                <div class="docs-list" id="docsList">
                    <div class="empty-state" data-i18n="kb.loading">加载中...</div>
                </div>
            </div>

            <!-- 底部按钮区 -->
            <div class="modal-actions">
                <button class="btn btn-secondary" id="docsModalCloseBtn" data-i18n="btn.close">关闭</button>
            </div>
        </div>
    </div>

    <!-- 重新切分 Modal -->
    <div class="modal-overlay" id="rechunkModal" style="display:none;">
        <div class="modal" style="max-width: min(520px, 92vw); width: auto; text-align:left;">
            <div class="modal-header">
                <h3 class="modal-title" data-i18n="docs.rechunk">修改切分方式</h3>
                <button class="icon-btn" onclick="closeRechunkModal()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" style="padding: 16px 20px;">
                <p id="rechunkFilename" style="font-size:0.85rem; color:var(--text-secondary); margin-bottom:14px; word-break:break-all;"></p>
                <div class="settings-field">
                    <label style="font-size:0.85rem; font-weight:500;" data-i18n="docs.chunkMethod">切分方式</label>
                    <select id="rechunkMethod" class="upload-chunk-select" style="margin-top:6px;" onchange="updateRechunkSizeVisibility()">
                        <option value="fixed" data-i18n="chunk.fixed.desc.short">✂️ 固定切分 · 适合：纯文本、日志</option>
                        <option value="recursive" selected data-i18n="chunk.recursive.desc.short">🔀 递归切分（推荐）· 适合：通用文档</option>
                        <option value="markdown" data-i18n="chunk.markdown.desc.short">📑 标题树切分 · 适合：保险条款、产品手册</option>
                        <option value="semantic" data-i18n="chunk.semantic.desc.short">🧠 语义切分（较慢）· 适合：文章、报告</option>
                    </select>
                </div>
                <div id="rechunkSizeFields">
                    <div class="settings-field" style="margin-top:10px;">
                        <label style="font-size:0.85rem; font-weight:500;" data-i18n="docs.chunkSize">分块大小 (token)</label>
                        <input type="number" id="rechunkSize" class="upload-chunk-num" style="width:100%; margin-top:6px;" min="100" max="2000" step="50" value="500">
                    </div>
                    <div class="settings-field" style="margin-top:10px;">
                        <label style="font-size:0.85rem; font-weight:500;" data-i18n="docs.chunkOverlap">分块重叠 (token)</label>
                        <input type="number" id="rechunkOverlap" class="upload-chunk-num" style="width:100%; margin-top:6px;" min="0" max="500" step="10" value="50">
                    </div>
                </div>
                <p id="rechunkHint" style="font-size:0.82rem; color:var(--text-secondary); margin-top:12px;"></p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeRechunkModal()" data-i18n="btn.cancel">取消</button>
                <button class="btn btn-primary" id="rechunkConfirmBtn" onclick="confirmRechunk()" data-i18n="docs.rechunkConfirm">重新切分</button>
            </div>
        </div>
    </div>

    <!-- 删除文档确认 Modal -->
    <div class="modal-overlay" id="deleteDocModal" style="display:none;">
        <div class="modal" style="max-width: 420px;">
            <div class="modal-header">
                <h3 class="modal-title" data-i18n="docs.delete.title">删除文档</h3>
                <button class="icon-btn" onclick="closeDeleteDocModal()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" style="padding: 16px 20px;">
                <div class="modal-icon" style="margin-bottom:12px;">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="var(--danger)" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
                        <path d="M10 11v6M14 11v6"></path>
                        <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
                    </svg>
                </div>
                <p id="deleteDocModalBody" style="word-break:break-all; margin-bottom:8px;"></p>
                <p style="font-size:0.85rem; color:var(--text-secondary);" data-i18n="docs.delete.hint">此操作不可恢复。</p>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeDeleteDocModal()" data-i18n="btn.cancel">取消</button>
                <button class="btn btn-danger" id="deleteDocConfirmBtn" data-i18n="btn.delete">删除</button>
            </div>
        </div>
    </div>

    <!-- 上传结果弹窗（有失败时显示） -->
    <div class="modal-overlay" id="uploadResultModal" style="display:none;">
        <div class="modal" style="max-width: 520px;">
            <div class="modal-header">
                <h3 class="modal-title" id="uploadResultTitle" data-i18n="upload.title">上传完成</h3>
                <button class="icon-btn" onclick="closeUploadResult()">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body" style="padding: 16px 20px;">
                <p id="uploadResultSummary" style="margin-bottom: 12px;"></p>
                <div id="uploadFailedList" style="display:none;">
                    <p id="uploadFailedTitle" data-i18n="upload.failed" style="font-weight:600; margin-bottom:8px; color: var(--danger);">以下文档未能成功上传：</p>
                    <div id="uploadFailedItems" style="
                        max-height: 240px;
                        overflow-y: auto;
                        background: var(--bg-secondary, #f8f8f8);
                        border-radius: 6px;
                        padding: 8px 12px;
                        font-size: 0.875rem;
                    "></div>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-primary" onclick="closeUploadResult()" data-i18n="btn.confirm">确定</button>
            </div>
        </div>
    </div>

    <script src="/static/knowledge.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => applyLang());
    </script>

</body>

</html>
